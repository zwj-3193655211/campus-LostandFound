spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:campus_lostfound_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 100ms
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  mail:
    host: localhost
    port: 2525
    username: test@example.com
    password: test-password

jwt:
  secret: test-secret-key-for-ci-only-please-change-before-production-1234567890
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

app:
  base-url: http://localhost:8081
  init-demo-data: false
  auto-fix-schema: false
  db-fix-enabled: true
