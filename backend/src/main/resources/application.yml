server:
  port: 8081

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: campus-lostfound

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/campus_lostfound?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: root
    password: zwj123456

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.163.com
    port: 465
    username: 19721623703@163.com
    password: SCRLKy8UaApwdSi5
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:please-configure-jwt-secret-in-environment}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

app:
  base-url: ${APP_BASE_URL:http://localhost:8081}
  init-demo-data: ${APP_INIT_DEMO_DATA:false}
  auto-fix-schema: ${APP_AUTO_FIX_SCHEMA:false}
  db-fix-enabled: ${APP_DB_FIX_ENABLED:false}

image-bed:
  upload-url: ${IMAGE_BED_UPLOAD_URL:https://img.scdn.io/api/v1.php}
  storage-destination: ${IMAGE_BED_STORAGE_DESTINATION:r2}
  output-format: ${IMAGE_BED_OUTPUT_FORMAT:auto}
  cdn-domain: ${IMAGE_BED_CDN_DOMAIN:}

logging:
  level:
    com.campus.lostfound: debug
    org.springframework.security: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
